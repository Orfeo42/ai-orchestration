services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  producer:
    build:
      context: .
      dockerfile: cmd/producer/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FORGEJO_URL: ${FORGEJO_URL}
      FORGEJO_TOKEN: ${FORGEJO_TOKEN}
      FORGEJO_ISSUE_REPOS: ${FORGEJO_ISSUE_REPOS}
      FORGEJO_ASSIGNEE: ${FORGEJO_ASSIGNEE:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      POLL_INTERVAL: ${POLL_INTERVAL:-60}
      PROJECTS_CONFIG: /config/projects.json
      TZ: Europe/Rome
    volumes:
      - ${PROJECTS_CONFIG_PATH:-./projects.json}:/config/projects.json:ro

  assess-consumer:
    build:
      context: .
      dockerfile: cmd/consumer/Dockerfile
    command: ["--pipeline=assess"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FORGEJO_URL: ${FORGEJO_URL}
      FORGEJO_TOKEN: ${FORGEJO_TOKEN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLAUDE_TIMEOUT: ${CLAUDE_TIMEOUT:-3600}
      GIT_USER_NAME: ${GIT_USER_NAME:-AI Orchestrator}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-ai@orchestrator.local}
      PROJECTS_CONFIG: /config/projects.json
      TZ: Europe/Rome
    volumes:
      - ${PROJECTS_CONFIG_PATH:-./projects.json}:/config/projects.json:ro
      - projects_data:/projects

  impl-consumer:
    build:
      context: .
      dockerfile: cmd/consumer/Dockerfile
    command: ["--pipeline=impl"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FORGEJO_URL: ${FORGEJO_URL}
      FORGEJO_TOKEN: ${FORGEJO_TOKEN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLAUDE_TIMEOUT: ${CLAUDE_TIMEOUT:-3600}
      GIT_USER_NAME: ${GIT_USER_NAME:-AI Orchestrator}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-ai@orchestrator.local}
      PROJECTS_CONFIG: /config/projects.json
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TZ: Europe/Rome
    volumes:
      - ${PROJECTS_CONFIG_PATH:-./projects.json}:/config/projects.json:ro
      - projects_data:/projects

  review-consumer:
    build:
      context: .
      dockerfile: cmd/consumer/Dockerfile
    command: ["--pipeline=review"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FORGEJO_URL: ${FORGEJO_URL}
      FORGEJO_TOKEN: ${FORGEJO_TOKEN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GIT_USER_NAME: ${GIT_USER_NAME:-AI Reviewer}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-ai-reviewer@orchestrator.local}
      PROJECTS_CONFIG: /config/projects.json
      TZ: Europe/Rome
    volumes:
      - ${PROJECTS_CONFIG_PATH:-./projects.json}:/config/projects.json:ro
      - projects_data:/projects

  webui:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TZ: Europe/Rome
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  redis_data:
  projects_data:
