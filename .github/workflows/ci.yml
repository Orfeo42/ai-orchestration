name: ci

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            pluginapi/go.sum
            plugins/echo/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "${unformatted}"
            exit 1
          fi
      - name: vet
        run: go vet ./... ./pluginapi/...
      - name: unit tests
        run: go test -short -count=1 ./...
      - name: pluginapi tests
        working-directory: pluginapi
        run: go test -count=1 -race ./...
      - name: echo plugin vet and tests
        working-directory: plugins/echo
        env:
          GOWORK: "off"
        run: |
          go vet ./...
          go test -count=1 -race ./...

  go-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: integration tests
        run: go test -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    if: github.event_name == 'release'
    needs: [go, go-integration, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: worker
            dockerfile: cmd/worker/Dockerfile
          - component: trigger
            dockerfile: cmd/trigger/Dockerfile
          - component: migrate
            dockerfile: cmd/migrate/Dockerfile
          - component: webui
            dockerfile: web/Dockerfile
          - component: plugin-echo
            dockerfile: plugins/echo/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/orfeo42/ai-orchestration-${{ matrix.component }}
          flavor: |
            latest=${{ !github.event.release.prerelease }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
