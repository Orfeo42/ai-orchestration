version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /pluginapi
      - /plugins/echo
      - /.tools/slogctx
      - /.tools/slogfmt
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /cmd/worker
      - /cmd/trigger
      - /cmd/migrate
      - /web
      - /plugins/echo
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose:
        patterns: ["*"]
